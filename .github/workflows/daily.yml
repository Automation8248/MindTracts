name: Daily Roblox Shorts Bot

on:
  schedule:
    - cron: '30 4 * * *' # Daily 10:00 AM IST par chalega
  workflow_dispatch: # Manual run button dega

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Updated Python version

      - name: Install FFmpeg and Node.js
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nodejs # Added Node.js for yt-dlp

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Run Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py # Running the python script

      - name: Commit updated links.txt
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add links.txt
          git commit -m "Automated update: Removed processed URL" || echo "No changes to commit"
          git push
