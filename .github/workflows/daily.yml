name: Daily Roblox Shorts Bot

on:
  schedule:
    - cron: '30 4 * * *' # Daily scheduled time
  workflow_dispatch:
    inputs:
      manual_link:
        description: 'Enter YouTube Video Link manually (Optional)'
        required: false
        type: string

jobs:
  build_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      # YEH NAYA STEP HAI: Manual link ko links.txt ke top par add karne ke liye
      - name: Insert Manual Link
        if: ${{ github.event.inputs.manual_link != '' }}
        run: |
          echo "${{ github.event.inputs.manual_link }}" | cat - links.txt > temp && mv temp links.txt

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies & Force Upgrade
        run: |
          pip install -r requirements.txt
          pip install --upgrade yt-dlp pytubefix

      - name: Create Cookies File
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: echo "$YOUTUBE_COOKIES" > cookies.txt

      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python main.py 

      - name: Commit updated links.txt
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add links.txt
          git commit -m "Automated update: Processed URL" || echo "No changes to commit"
          git push
