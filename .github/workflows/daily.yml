name: Daily Kuaishou Automation

on:
  schedule:
    - cron: '0 0 * * *' # Rozana raat 12 baje (UTC) chalega
  workflow_dispatch: # Manual run ka button enable karta hai

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Updated to 3.11 to fix your previous error

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests playwright
          playwright install chromium # Headless browser install karna zaroori hai

      - name: Run Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          python main.py
